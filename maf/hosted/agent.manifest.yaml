name: tco-jobpack-slice2
description: >
  MAF slice 2 (spell-check, extract, merge, validate, ask-or-finalize)
  hosted on Foundry via the Responses protocol.
metadata:
  tags:
    - Agent Framework
    - job-pack
    - Responses Protocol
template:
  name: tco-jobpack-slice2
  kind: hosted
  protocols:
    - protocol: responses
      version: 2.0.0
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
resources:
  - kind: model
    id: gpt-4o-mini-gs-2024-07-18
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME
